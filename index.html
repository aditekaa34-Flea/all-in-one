<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adit – Links</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #0d0d0d;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .container {
        margin-top: 60px;
        width: 90%;
        max-width: 500px;
    }

    .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: auto;
        margin-bottom: 20px;
        background-size: cover;
        background-position: center;
        border: 3px solid #8e2de2; /* border purple neon */
    }

    h1 {
        margin-bottom: 5px;
        font-size: 28px;
    }

    p {
        margin-top: -5px;
        color: #aaa;
        font-size: 14px;
    }

    .link-button {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        background: linear-gradient(90deg, #8e2de2, #4a00e0);
        border-radius: 12px;
        border: none;
        text-decoration: none;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        font-size: 16px;
        transition: 0.3s;
        box-shadow: 0 0 10px #8e2de2, 0 0 20px #4a00e0;
    }

    .link-button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px #8e2de2, 0 0 30px #4a00e0;
    }

    .link-button img {
        width: 20px;
        height: 20px;
        margin-right: 10px;
    }

    footer {
        margin-top: 40px;
        color: #555;
        font-size: 13px;
    }
</style>
</head>
<body>

<div class="container">

    <!-- Foto Profil -->

    <h1>Adit</h1>

    <!-- Tombol Sosial & Marketplace -->

        Instagram
    </a>
    <a href="https://www.tiktok.com/@adttt.e" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
        TikTok
    </a>
    <a href="https://shopee.co.id/USERNAME_LU" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968885.png" alt="Shopee">
        Shopee
    </a>
    <a href="https://www.tokopedia.com/USERNAME_LU" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968875.png" alt="Tokopedia">
        Tokopedia
    </a>
    <a href="https://facebook.com/USERNAME_LU" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
        Facebook
    </a>
    <a href="https://twitter.com/USERNAME_LU" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
        Twitter
    </a>
    <a href="https://wa.me/NO_HP_LU" class="link-button">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">

    </a>

</div>
